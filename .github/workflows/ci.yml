name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check code formatting
        run: CLANG_FORMAT=clang-format-21 make format-check

  build-and-test:
    name: Build & Test (Ubuntu, GCC-14)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC-14 and ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git $HOME/vcpkg
          cd $HOME/vcpkg
          ./bootstrap-vcpkg.sh

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            $HOME/vcpkg/installed
            $HOME/vcpkg/buildtrees
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Build
        env:
          CC: gcc-14
          CXX: g++-14
          BUILD_TYPE: Release
        run: |
          ccache --set-config=max_size=500M
          make build

      - name: Test
        run: make test

      - name: Show ccache stats
        run: ccache --show-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repo-ubuntu-gcc-14
          path: build/repo
          if-no-files-found: error
