name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check code formatting
        run: CLANG_FORMAT=clang-format-21 make format-check

  build-and-test:
    name: Build & Test (Ubuntu, Clang-18)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang-18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18

      - name: Install vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git $HOME/vcpkg
          cd $HOME/vcpkg
          ./bootstrap-vcpkg.sh

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            $HOME/vcpkg/installed
            $HOME/vcpkg/buildtrees
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Configure CMake
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DREPO_BUILD_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: cd build && ctest --output-on-failure --build-config Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repo-ubuntu-clang-18
          path: build/repo
          if-no-files-found: error
